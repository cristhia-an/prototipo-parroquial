<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Mi Parroquia — Diócesis de San Ejemplo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#faf6ef;--card:#fff;--tx:#2b2420;--mu:#5c534a;--ac:#5b3a8c;--ac2:#efe8f7;--gold:#b8892e;--gold2:#f6ecd6;--bd:#e8e0d2;--ok:#1f6b3a;--okb:#e3f2e7;--w:#7a4b00;--wb:#fdf0d5;--r:#9b1c1c;--rb:#fde4e4}
html{font-size:18px}*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Noto Sans",system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:1rem;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#fff 0,var(--bg) 55%,#f1e7d6 100%)}
.lcard{background:#fff;width:30rem;padding:2.2rem;border-radius:1.6rem;box-shadow:0 10px 40px #5b3a8c22}
.lcard h1{margin:.3rem 0 0;font-size:1.7rem;text-align:center;color:var(--ac)}.lcard .s{text-align:center;color:var(--mu);margin:0 0 1rem}
.logo{width:3.6rem;height:3.6rem;margin:auto;border-radius:1.1rem;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem}
label{display:block;font-weight:600;margin:.9rem 0 .3rem}
input,select,textarea{width:100%;padding:.7rem .9rem;border:2px solid var(--bd);border-radius:.8rem;background:#fff}
input:focus,select:focus{outline:3px solid #5b3a8c55;border-color:var(--ac)}
.hint{color:var(--mu);font-size:.85rem;margin-top:.25rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--ac);color:#fff;border:2px solid var(--ac);padding:.65rem 1.2rem;border-radius:.9rem;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.sec{background:#fff;color:var(--ac)}.btn.gold{background:var(--gold2);color:#5a3d00;border-color:#e2c98f}.btn.sm{padding:.4rem .8rem;font-size:.85rem}.btn.big{padding:.9rem 1.6rem;font-size:1.1rem}
.btn.full{width:100%;justify-content:center}
#app{display:none}
aside{position:fixed;left:0;top:0;bottom:0;width:15rem;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column}
.brand{display:flex;gap:.7rem;align-items:center;padding:1.1rem 1.1rem 1rem}.brand .logo{width:2.6rem;height:2.6rem;font-size:1.4rem;margin:0;border-radius:.8rem}.brand b{display:block;color:var(--ac);font-size:1.1rem}.brand small{color:var(--mu);font-size:.75rem}
nav{padding:.3rem .7rem;flex:1;overflow:auto}nav a{display:flex;align-items:center;gap:.7rem;padding:.65rem .9rem;margin:.15rem 0;border-radius:.9rem;cursor:pointer;color:var(--tx);font-weight:500}
nav a:hover{background:var(--bg)}nav a.on{background:var(--ac2);color:var(--ac);font-weight:700}nav a i{font-style:normal;width:1.6rem;text-align:center;font-size:1.15rem}
.side-help{margin:.8rem;padding:.8rem;border-radius:1rem;background:var(--gold2);font-size:.8rem;color:#5a3d00}
header{position:fixed;left:15rem;right:0;top:0;height:4.6rem;background:#fffdf9ee;backdrop-filter:blur(4px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:.8rem;padding:0 1.4rem;z-index:10}
header select{width:13.8rem;padding:.5rem .7rem}
.search{flex:1;position:relative;max-width:30rem}.search input{padding-left:2.6rem;border-color:#d8cbe9;background:#fdfbff}.search:before{content:"🔍";position:absolute;left:.9rem;top:.65rem}
#sres{display:none;position:absolute;top:3.3rem;left:0;width:min(30rem,90vw);background:#fff;border-radius:1rem;box-shadow:0 12px 40px #0002;padding:.6rem;border:1px solid var(--bd)}
#sres .gr{font-size:.75rem;text-transform:uppercase;color:var(--mu);font-weight:700;margin:.5rem .6rem .2rem;letter-spacing:.05em}
#sres a{display:flex;flex-direction:column;padding:.55rem .7rem;border-radius:.7rem;cursor:pointer}#sres a:hover,#sres a.f{background:var(--ac2)}#sres small{color:var(--mu)}
.fs{display:flex;border:2px solid var(--bd);border-radius:.8rem;overflow:hidden}.fs button{border:0;background:#fff;padding:.4rem .6rem;cursor:pointer;font-weight:700;color:var(--ac)}.fs button.on{background:var(--ac2)}
.fs button+button{border-left:1px solid var(--bd)}
.who{display:flex;align-items:center;gap:.5rem;font-size:.8rem;line-height:1.2}.av{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--gold2);color:#5a3d00;display:flex;align-items:center;justify-content:center;font-weight:700}
main{margin-left:15rem;padding:6.2rem 2rem 3rem}
.ph{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1.3rem}.ph h2{margin:0;font-size:1.65rem}.ph p{margin:.2rem 0 0;color:var(--mu)}.ph .sp{flex:1}
.card{background:var(--card);border-radius:1.3rem;padding:1.4rem;box-shadow:0 2px 10px #6b4e2a0f;border:1px solid #f0e9dc}
.card h3{margin:0 0 .9rem;font-size:1.15rem}
.g{display:grid;gap:1.2rem}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;padding:1.5rem;border-radius:1.4rem;cursor:pointer;border:2px solid transparent;background:#fff;box-shadow:0 2px 10px #6b4e2a12;text-align:left}
.qa:hover{border-color:var(--ac)}.qa .ic{font-size:2.1rem;width:3.6rem;height:3.6rem;border-radius:1rem;background:var(--ac2);display:flex;align-items:center;justify-content:center}
.qa b{font-size:1.2rem}.qa span{color:var(--mu);font-size:.9rem}.qa.g1 .ic{background:var(--gold2)}
.kpi .n{font-size:1.8rem;font-weight:700;color:var(--ac)}.kpi .l{color:var(--mu);font-size:.9rem}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:.8rem;color:var(--mu);padding:.6rem;border-bottom:2px solid var(--bd);font-weight:700}
td{padding:.7rem .6rem;border-bottom:1px solid #f0e9dc;vertical-align:middle}
.tag{display:inline-block;padding:.15rem .7rem;border-radius:2rem;font-size:.8rem;font-weight:600;background:var(--ac2);color:var(--ac);white-space:nowrap}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.w{background:var(--wb);color:var(--w)}.tag.r{background:var(--rb);color:var(--r)}
.tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:.4rem;padding-bottom:.3rem;scrollbar-width:thin;margin-bottom:1.2rem}.tabs button{flex-shrink:0;font-size:.92rem;border:2px solid var(--bd);background:#fff;padding:.5rem .85rem;border-radius:1rem;cursor:pointer;font-weight:600;color:var(--tx)}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.alert{display:flex;gap:.8rem;align-items:center;padding:.9rem 1.1rem;border-radius:1rem;background:var(--wb);color:var(--w);margin-bottom:1rem;border:1px solid #f1d9a6}.alert.i{background:var(--ac2);color:var(--ac);border-color:#d9cbec}.alert.ok{background:var(--okb);color:var(--ok);border-color:#b9dcc4}
.alert .sp{flex:1}
.dl{display:grid;grid-template-columns:10rem 1fr;gap:.45rem .8rem}.dl b{color:var(--mu);font-weight:600}
.tl{border-left:3px solid var(--ac2);margin-left:.5rem;padding-left:1.1rem}.tl div{position:relative;margin-bottom:.8rem}.tl div:before{content:"";position:absolute;left:-1.55rem;top:.35rem;width:.75rem;height:.75rem;border-radius:50%;background:var(--ac)}
.chk{list-style:none;padding:0;margin:0}.chk li{padding:.55rem 0;border-bottom:1px solid #f0e9dc;display:flex;gap:.6rem;align-items:center}.chk .y{color:var(--ok);font-weight:800}.chk .n{color:var(--r);font-weight:800}
.bar{height:.9rem;border-radius:1rem;background:#f0e9dc;overflow:hidden}.bar>div{height:100%;background:var(--ac);border-radius:1rem}
.hb{display:grid;grid-template-columns:9rem 1fr 3.5rem;align-items:center;gap:.6rem;margin:.55rem 0}
.row{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}.sp{flex:1}
/* wizard */
.wz{max-width:50rem;margin:auto}.steps{display:flex;justify-content:space-between;margin:.6rem 0 .4rem;font-size:.85rem;color:var(--mu)}.steps span.on{color:var(--ac);font-weight:700}.steps span.dn{color:var(--ok)}
.prog{height:.7rem;background:#eee3d0;border-radius:1rem;overflow:hidden;margin-bottom:1.4rem}.prog div{height:100%;background:linear-gradient(90deg,var(--ac),#8a63c4);border-radius:1rem;transition:.3s}
.wz .card{padding:2rem}.wz h3{font-size:1.45rem;margin:0 0 .3rem}.wz .lead{color:var(--mu);margin:0 0 1rem}
.wnav{display:flex;justify-content:space-between;margin-top:1.4rem}
.opt{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}.opt div{border:2px solid var(--bd);border-radius:1rem;padding:1rem;cursor:pointer;text-align:center;font-weight:600}.opt div.on{border-color:var(--ac);background:var(--ac2);color:var(--ac)}
.opt div i{display:block;font-style:normal;font-size:1.8rem}
/* overlays */
.ov{position:fixed;inset:0;background:#2b242066;display:none;align-items:center;justify-content:center;z-index:30}.ov.on{display:flex}
.dlg{background:#fff;border-radius:1.5rem;padding:1.8rem;width:34rem;box-shadow:0 20px 60px #0003}.dlg h3{margin:0 0 .5rem;font-size:1.35rem}
#help{position:fixed;top:0;right:0;bottom:0;width:26rem;background:#fff;box-shadow:-10px 0 40px #0002;z-index:25;transform:translateX(105%);transition:.25s;padding:1.6rem;overflow:auto}
#help.on{transform:none}#help h3{color:var(--ac);font-size:1.3rem;margin-top:0}#help li{margin:.5rem 0}
#toast{position:fixed;bottom:1.6rem;left:50%;transform:translateX(-50%) translateY(200%);background:#2b2420;color:#fff;padding:1rem 1.2rem 1rem 1.4rem;border-radius:1.1rem;display:flex;gap:1.2rem;align-items:center;z-index:40;transition:.3s;box-shadow:0 10px 30px #0004;max-width:44rem}
#toast.on{transform:translateX(-50%)}#toast .btn{background:#fff;color:var(--tx);border-color:#fff}
.paper{width:34rem;background:#fff;padding:2.2rem 2.4rem;font-family:Georgia,serif;font-size:.85rem;box-shadow:0 4px 30px #0003;position:relative;line-height:1.6}
.paper h4{text-align:center;font-size:1.25rem;letter-spacing:.15em;color:var(--ac);margin:.4rem 0}.paper .c{text-align:center}
.seal{position:absolute;right:2.4rem;bottom:2rem;opacity:.8}
.pdfbar{background:#3d3a40;color:#fff;padding:.6rem 1rem;border-radius:1rem 1rem 0 0;display:flex;align-items:center;gap:.8rem;width:34rem;font-size:.85rem}
.lit{display:grid;grid-template-columns:repeat(7,1fr);gap:.6rem}.lit>div{border-radius:1rem;padding:.7rem;min-height:6.5rem;background:#fff;border:1px solid var(--bd);font-size:.85rem}
.lit .col{height:.45rem;border-radius:1rem;margin-bottom:.4rem}
.wk{display:grid;grid-template-columns:4.5rem repeat(7,1fr);gap:.35rem;font-size:.8rem}.wk>div{min-height:2.6rem;border-radius:.6rem;padding:.25rem}.wk .h{font-weight:700;text-align:center;background:var(--ac2);color:var(--ac);padding:.4rem}
.ev{background:var(--gold2);border-radius:.5rem;padding:.25rem .4rem;font-weight:600}.ev.p{background:var(--ac2);color:var(--ac)}
.perm td{text-align:center}.perm td:first-child{text-align:left}
.psel{padding:0 1rem .6rem}.psel label{margin:0 0 .25rem;font-size:.75rem;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}.psel select{padding:.45rem .6rem;font-size:.9rem}
.zm{position:relative;flex-shrink:0}header .btn,.who{flex-shrink:0}
#zpop{display:none;position:absolute;right:0;top:3rem;background:#2b2420;color:#fff;border-radius:1rem;padding:.5rem;width:15rem;box-shadow:0 12px 40px #0004;z-index:50}#zpop.on{display:block}
#zpop a{display:flex;justify-content:space-between;padding:.6rem .9rem;border-radius:.6rem;cursor:pointer;font-weight:600}#zpop a:hover{background:#ffffff1a}#zpop a i{font-style:normal;color:#c9b3ef;visibility:hidden}#zpop a.on{color:#d7c4f7}#zpop a.on i{visibility:visible}
.zh{font-size:.75rem;color:#cfc6bb;padding:.4rem .9rem;text-transform:uppercase;letter-spacing:.05em}.zh2{font-size:.75rem;color:#cfc6bb;padding:.4rem .9rem;border-top:1px solid #ffffff22;margin-top:.3rem}
body[data-z="125"] .who>div:last-child,body[data-z="150"] .who>div:last-child{display:none}body[data-z="125"] .side-help,body[data-z="150"] .side-help{display:none}.ph{flex-wrap:wrap}.ph>.sp{min-width:1rem}.g4{grid-template-columns:repeat(auto-fit,minmax(8.8rem,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(13rem,1fr))}body[data-z="150"] .g2,body[data-z="150"] .g21,body[data-z="150"] .g12{grid-template-columns:1fr}main{overflow-x:hidden}
.search{min-width:9rem}
body[data-z="125"] .g4{grid-template-columns:repeat(4,1fr)}body[data-z="150"] .g4{grid-template-columns:repeat(2,1fr)}body[data-z="125"] .qa{padding:1.1rem}body[data-z="125"] .qa b{font-size:1.05rem}body[data-z="125"] .g4{gap:.8rem}
</style></head><body>
<div id="login"><div class="lcard"><div class="logo">✝</div><h1>Mi Parroquia</h1><p class="s">Diócesis de San Ejemplo</p>
<label for="u">Su usuario</label><input id="u" value="carmen.ulloa"><label for="pw">Su contraseña</label><input id="pw" type="password" value="12345678">
<label for="rol">¿Con qué función entra hoy?</label><select id="rol"><option>Secretaria parroquial</option><option>Párroco</option><option>Obispo / Curia</option><option>Catequista</option></select>
<button class="btn big full" style="margin-top:1.4rem" onclick="entrar()">➜ Entrar</button>
<p class="hint" style="text-align:center;margin-top:1rem">¿Olvidó su contraseña? Llame a la Curia: (01) 555-0100</p></div></div>
<div id="app">
<aside><div class="brand"><div class="logo">✝</div><div><b>Mi Parroquia</b><small>Diócesis de San Ejemplo</small></div></div><div class="psel"><label for="parr">Parroquia</label><select id="parr" aria-label="Parroquia"><option>⛪ Parroquia San José</option><option>⛪ Ntra. Sra. del Carmen</option><option>⛪ Santa Rosa de Lima</option><option>⛪ San Martín de Porres</option><option>🏛 Toda la diócesis</option></select></div><nav id="nav"></nav>
<div class="side-help">📞 ¿Necesita ayuda? Soporte de la Curia<br><b>(01) 555-0100</b></div></aside>
<header>
<div class="search"><input id="q" placeholder="Buscar persona o DNI…" oninput="buscar()" onfocus="buscar()"><div id="sres"></div></div>
<div class="zm"><button class="btn sec sm" id="zbtn" onclick="zt(event)" aria-haspopup="true" title="Tamaño de la pantalla">🔍 <span id="zval">100%</span> ▾</button><div id="zpop"><div class="zh">Tamaño de la pantalla</div><a data-z="75" onclick="zoom(75)"><span>75%</span><i>✔</i></a><a data-z="100" onclick="zoom(100)"><span>100%</span><i>✔</i></a><a data-z="125" onclick="zoom(125)"><span>125%</span><i>✔</i></a><a data-z="150" onclick="zoom(150)"><span>150%</span><i>✔</i></a><div class="zh2">Se recordará la próxima vez</div></div></div>
<button class="btn sec sm" onclick="ayuda()">❓ Ayuda</button>
<div class="who"><div class="av">CU</div><div><b>Carmen Ulloa</b><br><span id="rolt" style="color:var(--mu)">Secretaria</span></div></div></header>
<main id="main"></main></div>
<div id="help"><button class="btn sec sm" style="float:right" onclick="help.classList.remove('on')">✕ Cerrar</button><div id="helpc"></div></div>
<div class="ov" id="ov" onclick="if(event.target==this)cerrar()"><div id="ovc"></div></div>
<div id="toast"><span id="tmsg"></span><button class="btn sm" id="tundo" onclick="deshacer()">↶ Deshacer</button></div>
<script>
const $=s=>document.querySelector(s);
const tg=(t,c="")=>`<span class="tag ${c}">${t}</span>`;
const B=(ic,t,c="",on="")=>`<button class="btn ${c}" onclick="${on}">${ic} ${t}</button>`;
const T=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join("")}</tr>`).join("")}</table>`;
const K=(n,l)=>`<div class="card kpi"><div class="l">${l}</div><div class="n">${n}</div></div>`;
const C=(t,h,x="")=>`<div class="card" ${x}>${t?`<h3>${t}</h3>`:""}${h}</div>`;
const PH=(t,s,a="")=>`<div class="ph"><div><h2>${t}</h2><p>${s}</p></div><div class="sp"></div>${a}</div>`;
const ver=`<button class="btn sec sm" onclick="go('sac',1)">👁 Ver</button>`;
const MENU=[["inicio","🏠","Inicio"],["fel","👪","Feligreses y familias"],["sac","🕊️","Sacramentos"],["agenda","📅","Misas y agenda"],["cat","📖","Catequesis"],["fin","💰","Finanzas"],["equipo","⛪","Clero y personal"],["dio","🏛","Diócesis y sistema"]];
let cur="inicio",curTab=0;
const HELP={
inicio:["Inicio","Aquí empieza su día. Toque uno de los cuadros grandes para hacer las tareas más comunes.",["Para registrar un bautizo, toque <b>Registrar bautizo</b> y siga los pasos.","Para buscar a una persona, escriba su nombre o DNI en el buscador de arriba.","Si se equivoca al guardar, aparecerá el botón <b>Deshacer</b> abajo."]],
fel:["Feligreses y familias","Cada familia tiene una ficha con sus miembros, padrinos y sacramentos recibidos.",["Use <b>Nueva ficha</b> para registrar una familia.","Si aparece un aviso amarillo de <b>posible duplicado</b>, revise antes de crear otra ficha.","El DNI ayuda a evitar fichas repetidas."]],
sac:["Sacramentos","Aquí están las actas de los libros parroquiales: bautizos, confirmaciones, matrimonios y defunciones.",["Cada acta tiene <b>libro, folio y número</b>, igual que en el libro de papel.","Para entregar una copia, use <b>Emitir partida</b>: verá cómo queda antes de imprimir.","Las <b>notas marginales</b> registran cambios posteriores (por ejemplo, un matrimonio)."]],
agenda:["Misas y agenda","Organice horarios de misa, intenciones, reservas del templo y avisos a los fieles.",["Para anotar una intención, toque <b>Anotar intención</b> y siga los pasos.","El color de cada día indica el tiempo litúrgico.","Los avisos se pueden enviar por WhatsApp o correo."]],
cat:["Catequesis","Grupos, catequistas, inscripciones, pagos y asistencia.",["Revise la pestaña <b>Requisitos</b> antes del sacramento.","Cuando un grupo esté listo, use <b>Pasar a registro de sacramento</b>."]],
fin:["Finanzas","Registre todo el dinero que entra y sale. Cada movimiento genera un recibo.",["Al final del día, haga el <b>Cierre de caja</b>.","El aporte a la Curia se calcula solo."]],
equipo:["Clero y personal","Fichas de sacerdotes, diáconos y personal laico.",["Las licencias en <b>rojo</b> están por vencer: avise a la Curia.","Los traslados y nombramientos quedan registrados con su fecha."]],
dio:["Diócesis y sistema","Reportes para la Curia, el anuario para la Santa Sede, usuarios y copias de seguridad.",["Cada cambio en un acta queda guardado en <b>Auditoría</b>.","Las copias de seguridad se hacen solas cada noche."]],
wb:["Registrar bautizo","Complete un paso a la vez. Puede volver atrás sin perder lo escrito.",["Tenga a mano el DNI de los padres y padrinos.","Al final verá un resumen para revisar antes de guardar."]],
wi:["Anotar intención de misa","Anote por quién se ofrece la misa y cobre el estipendio.",["Elija primero el tipo de intención.","Al final se imprime el recibo."]]};
// ---------- pantallas
const V={
inicio:()=>`<div class="ph"><div><h2>Buenas tardes, Carmen 👋</h2><p>Martes 13 de octubre · Tiempo Ordinario <span class="tag ok">Verde</span></p></div></div>
<h2 style="font-size:1.4rem;margin:0 0 1rem">¿Qué desea hacer hoy?</h2>
<div class="g g4"><button class="qa" onclick="wiz('wb')"><div class="ic">🕊️</div><b>Registrar bautizo</b><span>Paso a paso, en 5 pasos</span></button>
<button class="qa g1" onclick="partida()"><div class="ic">📄</div><b>Emitir partida</b><span>Bautismo, confirmación, matrimonio</span></button>
<button class="qa" onclick="wiz('wi')"><div class="ic">🕯️</div><b>Anotar intención de misa</b><span>Con recibo de pago</span></button>
<button class="qa g1" onclick="$('#q').focus()"><div class="ic">🔍</div><b>Buscar feligrés</b><span>Por nombre o DNI</span></button></div>
