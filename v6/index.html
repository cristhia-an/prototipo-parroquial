<style>
:root{--bg:#faf8f4;--pn:#fffdf9;--sb:#f3f0ea;--ink:#1b1a17;--t2:#55514a;--t3:#6b665d;--ln:#e3ded4;--ln2:#d3cdc1;--ac:#7a2531;--acs:#f4e9ea;--ok:#2f5d3a;--oks:#e8efe6;--wa:#7a5a12;--was:#f5eedb;--serif:Georgia,"Times New Roman",serif;--sans:"Helvetica Neue",Helvetica,Arial,sans-serif}
html{font-size:17px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--sans)}
button,input,select{font:inherit;color:inherit}a{color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:1.05em;height:1.05em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--ln2);background:var(--pn);border-radius:6px;padding:.42rem .8rem;cursor:pointer;white-space:nowrap;font-size:.92rem;font-weight:500}
.btn:hover{border-color:var(--t3)}.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.p:hover{background:#333}
.btn.g{border-color:transparent;background:none}.btn.g:hover{background:var(--sb)}.btn.d{color:var(--ac)}
/* login */
#login{min-height:100vh;display:grid;place-items:center}
.lg{width:25rem;border:1px solid var(--ln);background:var(--pn);border-radius:10px;padding:2.2rem}
.lg h1{font:400 1.7rem var(--serif);margin:.2rem 0 .3rem}.lg p{color:var(--t2);margin:0 0 1.4rem}
.fld{display:block;margin-bottom:1rem}.fld span{display:block;font-size:.88rem;font-weight:600;margin-bottom:.3rem}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--ln2);background:#fff;border-radius:6px;padding:.55rem .7rem}
.lg .btn.p{width:100%;justify-content:center;padding:.65rem}.lgf{margin-top:1.4rem;font-size:.82rem;color:var(--t3);text-align:center}
/* shell */
#app{display:none}#app.on{display:block}
aside{position:fixed;inset:0 auto 0 0;width:240px;background:var(--sb);border-right:1px solid var(--ln);display:flex;flex-direction:column;padding:.9rem .7rem;overflow:auto}
.ps{display:flex;align-items:center;gap:.6rem;border:1px solid var(--ln2);background:var(--pn);border-radius:7px;padding:.5rem .6rem;cursor:pointer;margin-bottom:1rem;text-align:left;width:100%}
.ps .m{width:1.9rem;height:1.9rem;border-radius:5px;background:var(--ink);color:#fff;display:grid;place-items:center;font:1rem var(--serif)}
.ps b{display:block;font-size:.9rem;line-height:1.2}.ps small{display:block;white-space:nowrap;color:var(--t3);font-size:.76rem;line-height:1.3}
.grp{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:600;margin:1rem .55rem .3rem}
nav a{display:flex;align-items:center;gap:.6rem;padding:.38rem .55rem;border-radius:6px;text-decoration:none;font-size:.93rem;color:var(--t2);cursor:pointer}
nav a:hover{background:#ebe7df;color:var(--ink)}nav a.on{background:var(--pn);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--ln)}
nav a .n{margin-left:auto;font-size:.75rem;color:var(--t3);font-weight:500}nav a.on svg{color:var(--ac)}
.sbf{margin-top:auto;font-size:.76rem;color:var(--t3);padding:.6rem .55rem 0;border-top:1px solid var(--ln)}
.main{margin-left:240px;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);height:3.4rem;display:flex;align-items:center;gap:.6rem;padding:0 1.6rem}
.bc{display:flex;gap:.45rem;align-items:center;font-size:.92rem;color:var(--t3);flex:1;min-width:0;white-space:nowrap}.bc b{color:var(--ink);font-weight:600}
.sk{display:flex;align-items:center;gap:.5rem;border:1px solid var(--ln2);background:var(--pn);border-radius:6px;padding:.36rem .6rem;width:15rem;color:var(--t3);cursor:pointer;font-size:.9rem}
kbd{margin-left:auto;font:.72rem var(--sans);border:1px solid var(--ln2);border-radius:4px;padding:0 .3rem;white-space:nowrap}
.zm{position:relative}.zmm{display:none;position:absolute;right:0;top:2.6rem;background:var(--pn);border:1px solid var(--ln2);border-radius:8px;padding:.4rem;width:14rem;z-index:20}
.zm.on .zmm{display:block}.zmm p{margin:.2rem .4rem .4rem;font-size:.8rem;color:var(--t3)}
.zmm button{display:flex;width:100%;justify-content:space-between;border:0;background:none;padding:.4rem .5rem;border-radius:5px;cursor:pointer}.zmm button:hover{background:var(--sb)}.zmm button.on{font-weight:700;color:var(--ac)}
.av{width:1.9rem;height:1.9rem;border-radius:50%;border:1px solid var(--ln2);display:grid;place-items:center;font-size:.78rem;font-weight:700;background:var(--pn)}
.usr{display:flex;align-items:center;gap:.5rem;font-size:.88rem;padding-left:.6rem;border-left:1px solid var(--ln);white-space:nowrap}
.usr small{display:block;color:var(--t3);font-size:.74rem;line-height:1.1}
#v{padding:1.5rem 1.6rem 3rem}
.ph{display:flex;align-items:flex-end;gap:1rem;margin-bottom:1.2rem}.ph h1{font:400 1.75rem/1.2 var(--serif);margin:0}.ph p{margin:.2rem 0 0;color:var(--t2);font-size:.95rem}.ph .ac{margin-left:auto;display:flex;gap:.5rem}
.tabs{display:flex;gap:1.3rem;border-bottom:1px solid var(--ln);margin-bottom:1rem}.tabs button{border:0;background:none;padding:.5rem 0;cursor:pointer;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:.93rem}.tabs button.on{color:var(--ink);font-weight:600;border-color:var(--ink)}
.pn{border:1px solid var(--ln);background:var(--pn);border-radius:8px}.pnh{display:flex;align-items:center;padding:.7rem 1rem;border-bottom:1px solid var(--ln)}.pnh h3{margin:0;font-size:.95rem}.pnh .btn{margin-left:auto}
/* KPIs */
.kp{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ln);border-radius:8px;background:var(--pn);margin-bottom:1rem}
.kp>div{padding:.9rem 1rem;border-left:1px solid var(--ln)}.kp>div:first-child{border:0}
.kp small{color:var(--t2);font-size:.85rem}.kp b{display:block;font:400 1.75rem/1.25 var(--serif);margin:.2rem 0}.kp .tr{display:flex;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--t3)}
.up{color:var(--ok)}.dn{color:var(--ac)}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:1rem;margin-bottom:1rem}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.li{display:flex;gap:.8rem;align-items:center;padding:.6rem 1rem;border-top:1px solid var(--ln);font-size:.92rem}.li:first-child{border:0}
.li .tm{width:3.2rem;color:var(--t3);font-variant-numeric:tabular-nums}.li .x{flex:1;min-width:0}.li small{display:block;color:var(--t3);font-size:.8rem}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding:.8rem}.qa .btn{justify-content:flex-start}
/* badges */
.bd{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;font-weight:600;padding:.08rem .5rem;border-radius:99px;border:1px solid var(--ln2);color:var(--t2);white-space:nowrap}
.bd:before{content:"";width:.42rem;height:.42rem;border-radius:50%;background:currentColor}
.bd.ok{color:var(--ok);background:var(--oks);border-color:#cbdcc7}.bd.wa{color:var(--wa);background:var(--was);border-color:#e7d9ad}.bd.ac{color:var(--ac);background:var(--acs);border-color:#e6cfd2}
/* table */
.fb{display:flex;gap:.5rem;align-items:center;padding:.7rem .8rem;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.chip{border:1px dashed var(--ln2);background:none;border-radius:99px;padding:.22rem .7rem;font-size:.85rem;cursor:pointer;color:var(--t2)}.chip.on{border-style:solid;border-color:var(--ink);color:var(--ink);font-weight:600}
.fs{display:flex;align-items:center;gap:.4rem;border:1px solid var(--ln2);border-radius:6px;padding:.28rem .55rem;background:#fff;margin-left:auto;width:15rem}.fs input{border:0;outline:0;width:100%;font-size:.9rem;background:none}
.sel{border:1px solid var(--ln2);border-radius:6px;padding:.28rem .5rem;background:#fff;font-size:.88rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}th{text-align:left;font-size:.8rem;font-weight:600;color:var(--t2);padding:.55rem .8rem;border-bottom:1px solid var(--ln);white-space:nowrap;background:#fbf9f5}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}th .ar{opacity:.5;margin-left:.2rem}th.on .ar{opacity:1;color:var(--ac)}
td{padding:.55rem .8rem;white-space:nowrap;border-bottom:1px solid var(--ln);vertical-align:middle}td b{white-space:normal;display:inline-block;min-width:10rem}tr.r{cursor:pointer}tr.r:hover td{background:#f7f4ee}tr.sl td{background:var(--acs)!important}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}td small{display:block;color:var(--t3);font-size:.8rem}
input[type=checkbox]{width:1rem;height:1rem;accent-color:var(--ac)}
.pg{display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;font-size:.86rem;color:var(--t2)}.pg .btn{padding:.25rem .6rem}.pg span:first-child{margin-right:auto}
.bulk{display:none;align-items:center;gap:.6rem;padding:.5rem .8rem;background:var(--ink);color:#fff;font-size:.9rem;border-radius:7px 7px 0 0}.bulk.on{display:flex}.bulk .btn{background:none;color:#fff;border-color:#666;padding:.25rem .6rem}
/* drawer, modal */
#scr{position:fixed;inset:0;background:rgba(27,26,23,.35);display:none;z-index:30}#scr.on{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:34rem;max-width:92vw;background:var(--pn);border-left:1px solid var(--ln2);z-index:31;transform:translateX(102%);transition:transform .2s;display:flex;flex-direction:column}.dr.on{transform:none}
.drh{display:flex;align-items:flex-start;gap:.8rem;padding:1rem 1.2rem;border-bottom:1px solid var(--ln)}.drh h2{font:400 1.4rem var(--serif);margin:0}.drh p{margin:.1rem 0 0;color:var(--t2);font-size:.88rem}.drh .btn{margin-left:auto}
.drb{padding:1rem 1.2rem;overflow:auto;flex:1}.drf{padding:.8rem 1.2rem;border-top:1px solid var(--ln);display:flex;gap:.5rem;justify-content:flex-end}
dl{display:grid;grid-template-columns:9rem 1fr;gap:.45rem 1rem;margin:0 0 1rem;font-size:.92rem}dt{color:var(--t3)}dd{margin:0}
.tl{border-left:1px solid var(--ln2);margin:.4rem 0 1rem .4rem;padding-left:1rem}.tl div{position:relative;padding:.3rem 0;font-size:.92rem}.tl div:before{content:"";position:absolute;left:-1.33rem;top:.75rem;width:.55rem;height:.55rem;border-radius:50%;background:var(--pn);border:1.5px solid var(--t3)}.tl div.ok:before{background:var(--ink);border-color:var(--ink)}
.tl small{color:var(--t3)}.tl a{color:var(--ac);font-size:.85rem;margin-left:.4rem;cursor:pointer}
.nt{border:1px solid #e7d9ad;background:var(--was);border-radius:6px;padding:.6rem .8rem;font-size:.88rem;margin-bottom:1rem;display:flex;gap:.5rem}
h4{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin:1rem 0 .4rem}
.md{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:46rem;max-width:94vw;background:var(--pn);border:1px solid var(--ln2);border-radius:10px;z-index:32;display:none;flex-direction:column;max-height:90vh}.md.on{display:flex}
.wz{display:grid;grid-template-columns:13rem 1fr;min-height:24rem}.wzs{border-right:1px solid var(--ln);padding:1rem;background:#fbf9f5;border-radius:0 0 0 10px}
.wzs div{display:flex;gap:.6rem;align-items:center;padding:.38rem 0;font-size:.9rem;color:var(--t3)}.wzs i{font-style:normal;width:1.4rem;height:1.4rem;border-radius:50%;border:1px solid var(--ln2);display:grid;place-items:center;font-size:.75rem}
.wzs .on{color:var(--ink);font-weight:600}.wzs .on i{border-color:var(--ink);background:var(--ink);color:#fff}.wzs .dn i{border-color:var(--ink);color:var(--ink)}
.wzb{padding:1.2rem 1.4rem}.wzb h3{font:400 1.3rem var(--serif);margin:0 0 .2rem}.wzb>p{color:var(--t2);margin:0 0 1rem;font-size:.92rem}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}.hint{font-size:.82rem;color:var(--t3);margin-top:-.6rem;margin-bottom:1rem}
.cf{width:28rem}
#toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:.6rem .7rem .6rem 1rem;display:none;align-items:center;gap:.9rem;z-index:40;font-size:.92rem}#toast.on{display:flex}#toast .btn{background:none;color:#fff;border-color:#777}
.pal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:38rem;background:var(--pn);border:1px solid var(--ln2);border-radius:10px;z-index:32;display:none}.pal.on{display:block}
.pal input{width:100%;border:0;border-bottom:1px solid var(--ln);padding:.9rem 1rem;font-size:1.05rem;outline:0;background:none;border-radius:10px 10px 0 0}
.pal .gt{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);padding:.6rem 1rem .2rem}.pal .it{display:flex;gap:.6rem;align-items:center;padding:.45rem 1rem;cursor:pointer;font-size:.93rem}.pal .it:hover,.pal .it.on{background:var(--sb)}.pal .it small{margin-left:auto;color:var(--t3)}
.paper{background:#fff;border:1px solid var(--ln2);padding:2.2rem 2.6rem;font-family:var(--serif);font-size:.98rem;line-height:1.7;position:relative}
.paper h2{text-align:center;letter-spacing:.2em;font-weight:400;margin:.3rem 0}.paper .c{text-align:center;color:var(--t2);font-size:.85rem}
.seal{position:absolute;right:2.4rem;bottom:1.6rem;width:5rem;height:5rem;border:1.5px solid var(--ac);border-radius:50%;color:var(--ac);display:grid;place-items:center;font:.6rem var(--sans);text-align:center;letter-spacing:.06em}
.chart{padding:.6rem 1rem 1rem}.chart text{font:14px var(--sans);fill:#6b665d}
.perm td{text-align:center}.perm td:first-child{text-align:left}.ck{color:var(--ink)}.no{color:#b5afa4}
.bar{height:.45rem;background:var(--ln);border-radius:9px;overflow:hidden;width:7rem;display:inline-block;vertical-align:middle;margin-right:.4rem}.bar i{display:block;height:100%;background:var(--ink)}
body[data-z="125"] .sk,body[data-z="150"] .sk{width:auto}body[data-z="125"] .sk kbd,body[data-z="150"] .sk kbd,body[data-z="150"] .usr div{display:none}
body[data-z="125"] .kp,body[data-z="150"] .kp{grid-template-columns:1fr 1fr}body[data-z="125"] .kp>div:nth-child(3),body[data-z="150"] .kp>div:nth-child(3){border-left:0}body[data-z="125"] .kp>div:nth-child(n+3),body[data-z="150"] .kp>div:nth-child(n+3){border-top:1px solid var(--ln)}
body[data-z="150"] .g2,body[data-z="150"] .g3{grid-template-columns:1fr}body[data-z="125"] .g3{grid-template-columns:1fr 1fr}
body[data-z="125"] .ph,body[data-z="150"] .ph{flex-wrap:wrap}body[data-z="125"] .ph .ac,body[data-z="150"] .ph .ac{margin-left:0}

</style></head><body data-z="100">
