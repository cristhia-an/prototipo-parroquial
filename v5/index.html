<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Parroquia San José — Gestión parroquial</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#faf8f4;--ink:#1b1a17;--mu:#5c584f;--hair:#e3ded4;--hair2:#cfc8bb;--ac:#7a2531;--w:42rem}
html{font-size:18px}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.serif,h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:400;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:1.05em;height:1.05em;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sc{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);font-weight:600}
.mu{color:var(--mu)}
/* botones */
.b{display:inline-flex;align-items:center;gap:.55rem;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:.7rem 1.3rem;font-weight:600;cursor:pointer;border-radius:2px;white-space:nowrap}
.b.o{background:transparent;color:var(--ink)}.b.t{background:transparent;border-color:transparent;color:var(--ink);padding:.7rem .2rem;text-decoration:underline;text-underline-offset:.3em;text-decoration-color:var(--hair2)}
.b.t:hover{text-decoration-color:var(--ink)}.b.sm{padding:.4rem .8rem;font-size:.88rem}.b:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.lnk{display:inline-flex;align-items:center;gap:.4rem;border:0;background:none;padding:0;cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:.3em;text-decoration-color:var(--hair2)}.lnk:hover{text-decoration-color:var(--ink)}.lnk.ac{color:var(--ac)}
/* campos */
label{display:block;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:600;margin:1.3rem 0 .2rem}
input,select{width:100%;border:0;border-bottom:1px solid var(--hair2);background:transparent;padding:.45rem 0;font-size:1.1rem;border-radius:0}
input:focus,select:focus{outline:0;border-bottom:2px solid var(--ink);padding-bottom:calc(.45rem - 1px)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 2rem}.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 2rem}
/* login */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
#login .box{width:24rem}#login h1{font-size:2.6rem;margin:.4rem 0 .2rem;line-height:1.1}#login .b{width:100%;justify-content:center;margin-top:2.2rem}
#login footer{position:fixed;bottom:1.5rem;font-size:.8rem;color:var(--mu)}
/* cabecera */
#app{display:none}
header{border-bottom:1px solid var(--hair);background:var(--bg);position:sticky;top:0;z-index:10}
.hd{max-width:76rem;margin:0 auto;padding:1.1rem 1.6rem;display:flex;align-items:center;gap:1.3rem}
.wm{display:flex;flex-direction:column;line-height:1.15}.wm b{font-family:Georgia,serif;font-weight:400;font-size:1.25rem}.wm select{border:0;padding:0;font-size:.78rem;color:var(--mu);width:auto;background:transparent;cursor:pointer}
nav{display:flex;gap:1.25rem;flex:1;justify-content:center}nav a{font-size:.95rem;text-decoration:none;cursor:pointer;padding:.3rem 0;border-bottom:1px solid transparent;font-weight:500}nav a:hover{border-color:var(--hair2)}nav a.on{border-color:var(--ink);font-weight:700}
.tools{display:flex;gap:1.1rem;align-items:center;font-size:.9rem}.tools button{border:0;background:none;cursor:pointer;display:flex;align-items:center;gap:.4rem;font-weight:600;padding:.2rem 0}
.tools kbd{white-space:nowrap;font:600 .7rem "Helvetica Neue",Arial;border:1px solid var(--hair2);padding:.05rem .3rem;color:var(--mu)}
.zw{position:relative}.zm{display:none;position:absolute;right:0;top:2.2rem;background:var(--bg);border:1px solid var(--ink);min-width:12rem;z-index:30}.zm.on{display:block}
.zm a{display:flex;justify-content:space-between;padding:.6rem 1rem;cursor:pointer;text-decoration:none}.zm a:hover{background:#f0ece4}.zm a.on{font-weight:700}.zm a.on:after{content:"—";color:var(--ac)}.zm p{margin:0;padding:.5rem 1rem;font-size:.78rem;color:var(--mu);border-top:1px solid var(--hair)}
/* contenido */
main{max-width:var(--w);margin:0 auto;padding:4.5rem 0 7rem}
.ey{margin-bottom:.9rem}
h1.big{font-size:3.3rem;line-height:1.08;margin:0 0 .8rem}
h1.pg{font-size:2.6rem;line-height:1.1;margin:0 0 .5rem}
.lead{font-size:1.2rem;color:var(--mu);margin:0}
.lead em{font-family:Georgia,serif;font-style:italic;color:var(--ink)}
section{margin-top:4rem}section>.sc{display:block;padding-bottom:.8rem;border-bottom:1px solid var(--ink)}
.act a{display:grid;grid-template-columns:3rem 1fr auto;align-items:baseline;padding:1.25rem 0;border-bottom:1px solid var(--hair);text-decoration:none;cursor:pointer}
.act a:hover .t{text-decoration:underline;text-underline-offset:.25em;text-decoration-thickness:1px}.act .n{font-family:Georgia,serif;color:var(--ac);font-size:1rem}.act .t{font-family:Georgia,serif;font-size:1.6rem;line-height:1.2}.act .d{display:block;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.9rem;color:var(--mu);margin-top:.2rem}
.act svg{width:1.3rem;height:1.3rem}
.ls>div{display:grid;grid-template-columns:6rem 1fr auto;gap:1rem;align-items:baseline;padding:1rem 0;border-bottom:1px solid var(--hair)}
.ls .k{font-variant-numeric:tabular-nums;color:var(--mu);font-size:.95rem}.ls .v b{font-weight:600;display:block}.ls .v span{color:var(--mu);font-size:.9rem}.ls .r{font-size:.9rem;text-align:right}
.ls.w>div{grid-template-columns:1fr auto}
.st{font-size:.8rem;font-weight:600;letter-spacing:.04em}.st.ok{color:#2c5a34}.st.w{color:#7a4a00}.st.r,.st.ac{color:var(--ac)}
.sub{display:flex;gap:1.6rem;margin:2rem 0 0;border-bottom:1px solid var(--hair)}.sub a{padding:.6rem 0;cursor:pointer;text-decoration:none;color:var(--mu);border-bottom:1px solid transparent;margin-bottom:-1px;font-weight:500}.sub a.on{color:var(--ink);border-color:var(--ink);font-weight:700}
.note{border-left:2px solid var(--ac);padding:.2rem 0 .2rem 1.1rem;margin:2rem 0;display:flex;gap:1.5rem;align-items:baseline}.note p{margin:0;flex:1}
.fig{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--hair);margin-top:2.5rem}.fig div{padding:1.1rem 1rem 1.2rem 0}.fig div+div{padding-left:1rem;border-left:1px solid var(--hair)}.fig b{display:block;font-family:Georgia,serif;font-weight:400;font-size:1.9rem;line-height:1.1;margin-top:.3rem;font-variant-numeric:lining-nums}
.tl>div{display:grid;grid-template-columns:2rem 11rem 1fr auto;gap:.8rem;padding:1.1rem 0;border-bottom:1px solid var(--hair);align-items:baseline}
.tl .m{font-family:Georgia,serif;color:var(--mu)}.tl .ok .m{color:var(--ink)}.tl .now .m{color:var(--ac)}.tl .s{font-family:Georgia,serif;font-size:1.25rem}.tl .p .s{color:var(--mu)}.tl .x{font-size:.92rem}.tl .x span{display:block;color:var(--mu)}
.perm>div{display:grid;grid-template-columns:1fr repeat(4,7.4rem);padding:.75rem 0;border-bottom:1px solid var(--hair);font-size:.92rem}.perm>div>span:not(:first-child){text-align:center}.perm .h{font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);font-weight:600;border-bottom:1px solid var(--ink)}
/* flujo */
.flow{min-height:calc(100vh - 5rem);display:flex;flex-direction:column}
.fl-top{max-width:var(--w);width:100%;margin:2.2rem auto 0;display:flex;align-items:center;gap:1rem}
.bar{max-width:var(--w);width:100%;margin:.8rem auto 0;height:1px;background:var(--hair2);position:relative}.bar i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink)}
.fl{max-width:var(--w);width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:3.2rem 0 3rem}
.fl h2{font-size:2.5rem;line-height:1.15;margin:.6rem 0 .6rem}.fl .hint{color:var(--mu);font-size:1.05rem;margin:0 0 1rem}
.fl-nav{display:flex;align-items:center;gap:1rem;margin-top:2.4rem}
.opt{display:flex;flex-direction:column;border-top:1px solid var(--hair);margin-top:1rem}.opt div{padding:1rem 0;border-bottom:1px solid var(--hair);cursor:pointer;display:flex;gap:1rem;align-items:center;font-size:1.15rem}.opt div:before{content:"";width:.8rem;height:.8rem;border:1px solid var(--ink);border-radius:50%}.opt div.on:before{background:var(--ac);border-color:var(--ac)}
.rev>div{display:grid;grid-template-columns:10rem 1fr;padding:.7rem 0;border-bottom:1px solid var(--hair);font-size:1.08rem}.rev span{color:var(--mu);font-size:.95rem}
/* capas */
#ov{position:fixed;inset:0;background:#faf8f4;display:none;z-index:50;overflow:auto}#ov.on{display:block}
.dlg{max-width:30rem;margin:22vh auto 0;border-top:1px solid var(--ink);padding-top:1.4rem}.dlg h3{font-size:1.9rem;margin:0 0 .6rem;line-height:1.15}.dlg .row{display:flex;justify-content:flex-end;gap:1rem;margin-top:2rem}
#srch .in{max-width:var(--w);margin:14vh auto 0;display:flex;align-items:center;gap:1rem;border-bottom:1px solid var(--ink);padding-bottom:.6rem}#srch input{border:0;font-family:Georgia,serif;font-size:2.1rem;padding:0}#srch input:focus{border:0;padding:0}
#srch .res{max-width:var(--w);margin:1.5rem auto}#srch .res a{display:grid;grid-template-columns:1fr auto;padding:.85rem 0;border-bottom:1px solid var(--hair);cursor:pointer;text-decoration:none}#srch .res a:hover b,#srch .res a.f b{text-decoration:underline;text-underline-offset:.25em;text-decoration-thickness:1px}#srch .res a span{color:var(--mu);font-size:.9rem}#srch .res .sc{display:block;margin-top:1.6rem;padding-bottom:.4rem}
.paperw{max-width:40rem;margin:3rem auto}.ptools{display:flex;gap:1.2rem;align-items:center;margin-bottom:1rem}
.paper{background:#fff;border:1px solid var(--hair2);padding:3rem 3.4rem;font-family:Georgia,serif;font-size:.95rem;line-height:1.75;position:relative}.paper .c{text-align:center}.paper h4{font-weight:400;text-align:center;font-size:1.5rem;letter-spacing:.2em;margin:.6rem 0 .2rem}.paper .seal{position:absolute;right:3rem;bottom:2.6rem}
#help{position:fixed;top:0;right:0;bottom:0;width:27rem;max-width:92vw;background:var(--bg);border-left:1px solid var(--ink);z-index:60;transform:translateX(102%);transition:transform .2s;padding:2.2rem 2.2rem;overflow:auto}#help.on{transform:none}#help h3{font-size:1.7rem;margin:.4rem 0 .8rem}#help ol{padding-left:1.2rem}#help li{margin:.6rem 0}
#toast{position:fixed;left:50%;bottom:2rem;transform:translate(-50%,250%);background:var(--ink);color:var(--bg);padding:.85rem 1.4rem;display:flex;gap:1.6rem;align-items:center;z-index:70;transition:transform .25s}#toast.on{transform:translate(-50%,0)}#toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;text-underline-offset:.3em;cursor:pointer;display:flex;gap:.4rem;align-items:center}
body[data-z="125"] nav,body[data-z="150"] nav{gap:1rem}body[data-z="125"] .tools kbd,body[data-z="150"] .tools kbd{display:none}body[data-z="125"] .hd,body[data-z="150"] .hd{padding:1rem 1.2rem;gap:1.1rem}body[data-z="150"] .hd{flex-wrap:wrap}body[data-z="150"] nav{order:3;flex-basis:100%;justify-content:flex-start;flex-wrap:wrap;gap:.3rem 1.2rem}
body[data-z="125"] main,body[data-z="150"] main{padding-left:1.5rem;padding-right:1.5rem}body[data-z="150"] .fig{grid-template-columns:1fr 1fr}body[data-z="150"] h1.big{font-size:2.6rem}
</style></head><body>
<div id="login"><div class="box"><span class="sc">Diócesis de San Ejemplo</span><h1>Parroquia<br>San José</h1><p class="mu" style="margin:0">Registro y gestión parroquial</p>
<label for="lu">Usuario</label><input id="lu" value="carmen.ulloa" autocomplete="username"><label for="lp">Contraseña</label><input id="lp" type="password" value="12345678"><label for="lr">Función</label><select id="lr"><option>Secretaria parroquial</option><option>Párroco</option><option>Obispo / Curia</option><option>Catequista</option></select>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const I=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const BT=(t,on,c="",ic="")=>`<button class="b ${c}" onclick="${on}">${ic?I(ic):""}${t}</button>`;

const PEOPLE=[

{id:"diego",n:"Diego Quispe Rojas",dni:"78123456",fam:"Quispe Rojas",meta:"Hijo · 14 años · Sector 3",tl:[["Bautismo","ok","10 de mayo de 2012","Libro IX · folio 30 · n.º 112","part"],["Primera Comunión","ok","24 de noviembre de 2024","Grupo San Juan Bosco"],["Confirmación","now","En preparación","Grupo San Pablo · asistencia 92 %","req"],["Matrimonio","p","",""]],pad:"Luis Huamán y Rosa López"},

{id:"juan",n:"Juan Quispe Mamani",dni:"41234567",fam:"Quispe Rojas",meta:"Padre · 41 años · Sector 3",tl:[["Bautismo","ok","1985","Parroquia del Carmen"],["Primera Comunión","ok","1994",""],["Confirmación","ok","2000",""],["Matrimonio","ok","12 de septiembre de 2015","Libro VIII · folio 12 · n.º 41","part"]],pad:"—"},
{id:"maria",n:"María Rojas Flores",dni:"42345678",fam:"Quispe Rojas",meta:"Madre · 38 años · Sector 3",tl:[["Bautismo","ok","1988",""],["Primera Comunión","ok","1997",""],["Confirmación","ok","2003",""],["Matrimonio","ok","12 de septiembre de 2015","Libro VIII · folio 12 · n.º 41","part"]],pad:"—"},

const HELP={inicio:["Inicio","Desde aquí empieza el día.",["Elija una de las cuatro acciones principales.","Debajo verá lo que hay para hoy.","Para encontrar a alguien, use <b>Buscar</b> arriba o pulse Ctrl K."]],personas:["Personas","Cada persona tiene su ficha con su familia y su camino sacramental.",["Busque por nombre o DNI.","Si aparece una nota sobre un posible duplicado, revísela antes de crear otra ficha."]],ficha:["Ficha de persona","El camino sacramental muestra, en orden, los sacramentos recibidos y los pendientes.",["Al lado de cada sacramento está la acción posible: emitir partida, ver requisitos, cobrar.","Use Editar para corregir datos. Todo cambio queda registrado."]],sac:["Sacramentos","Libros parroquiales, expedientes matrimoniales y pedidos entre parroquias.",["Cada acta lleva libro, folio y número, como en el libro de papel.","Emitir partida muestra el documento antes de imprimirlo."]],agenda:["Agenda","Misas, intenciones, reservas del templo y avisos.",["Para anotar una intención, use Anotar intención.","El tiempo litúrgico aparece en el encabezado."]],cat:["Catequesis","Grupos, inscripciones, pagos, asistencia y requisitos.",["Cuando un grupo esté listo, use Pasar al registro de sacramentos."]],adm:["Administración","Finanzas, clero y personal, reportes a la Curia y usuarios.",["La caja del día se cierra al final de la jornada.","Las licencias por vencer aparecen marcadas."]],flow:["Paso a paso","Una pregunta por pantalla.",["Responda y pulse Continuar.","Puede volver atrás sin perder nada.","Antes de guardar verá un resumen."]]};
function entrar(){$("#login").style.display="none";$("#app").style.display="block";go("inicio")}

const V={
inicio:()=>`<div class="ey sc">Martes, 13 de octubre de 2026</div><h1 class="big">Buenas tardes, Carmen.</h1><p class="lead">XXVIII semana del <em>Tiempo Ordinario</em> · color litúrgico verde.<br>Mañana, Santa Teresa de Jesús.</p>
