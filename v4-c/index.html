document.addEventListener("click",e=>{if(e.target.id=="ov")cerrarOv();const o=e.target.closest(".opts div");if(o){o.parentNode.querySelectorAll("div").forEach(d=>d.classList.remove("on"));o.classList.add("on")}if(!e.target.closest(".zm"))$$(".zpop").forEach(z=>z.classList.remove("on"))});

const ZB=(up)=>`<div class="zm"><button class="btn sec sm zbtn" onclick="event.stopPropagation();this.nextElementSibling.classList.toggle('on')" title="Tamaño de la pantalla">🔍 <span class="zval">100%</span> ▾</button><div class="zpop ${up?'up':''}"><small>Tamaño de la pantalla</small>${[75,100,125,150].map(z=>`<a data-z="${z}" onclick="zoom(${z})"><span>${z}%</span><i>✓</i></a>`).join("")}<small>Se recordará la próxima vez</small></div></div>`;

${W("lit","🎨","Semana litúrgica","m",`<div class="week">${[["Lun","#2e7d32","Pilar"],["Mar","#2e7d32","Feria"],["Mié","#c62828","S. Calixto"],["Jue","#e8e8e8","Sta. Teresa"],["Vie","#2e7d32","Feria"],["Sáb","#c62828","S. Ignacio"],["Dom","#2e7d32","Domund"]].map(d=>`<div><i style="background:${d[1]}"></i><b>${d[0]}</b><br>${d[2]}</div>`).join("")}</div>`)}
</div>`}

${p.dup?`<div class="alert">⚠️ <span><b>Posible duplicado</b> en Parroquia del Carmen.</span></div>`:""}<div class="path">${p.tl.map(t=>`<div class="stp ${t[1]}"><div class="o">${ic[t[0]]}</div><b>${t[0]}</b><small>${t[2]||"Pendiente"}</small></div>`).join("")}</div></div>
