<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Sistema de Gestión Parroquial — Diócesis de San Ejemplo</title>

<style>

.btn{display:inline-block;background:var(--navy);color:#fff;border:0;padding:9px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}

#app{display:none;height:100vh}
aside{position:fixed;left:0;top:0;bottom:0;width:236px;background:var(--navy);color:#cfd8e8;overflow:auto}
.brand{padding:18px;border-bottom:1px solid #ffffff1a;display:flex;gap:10px;align-items:center}.brand b{color:#fff;display:block}.brand small{color:var(--gold)}
.brand .lg{width:38px;height:38px;border-radius:9px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
nav a{display:flex;gap:10px;padding:10px 20px;color:#cfd8e8;text-decoration:none;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:#ffffff0d}nav a.on{background:#ffffff14;color:#fff;border-left-color:var(--gold)}
nav .sec{padding:14px 20px 4px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8899b8}
header{position:fixed;left:236px;right:0;top:0;height:60px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 24px;gap:14px;z-index:5}

main{margin-left:236px;padding:84px 26px 30px}
h2{margin:0 0 4px;color:var(--navy);font-size:22px}.sub{color:var(--mu);margin-bottom:18px}
.g{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px}
.card h3{margin:0 0 12px;font-size:15px;color:var(--navy)}

table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--mu);padding:8px;border-bottom:2px solid var(--bd);background:#fafbfd}
td{padding:8px;border-bottom:1px solid var(--bd)}tr.cl{cursor:pointer}tr.cl:hover td{background:#f7f9fd}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:#e8eefb;color:var(--navy2)}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--bd);margin-bottom:14px}.tabs span{padding:9px 16px;cursor:pointer;color:var(--mu);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px}

.chk{color:#16a34a;font-weight:700;text-align:center}.x{color:#d1d5db;text-align:center}

.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20}.modal.on{display:flex}

</style></head><body>

<script>
const V=[["dash","📊","Dashboard","General"],["fel","👪","Feligreses","Pastoral"],["sac","🕊","Sacramentos"],["agenda","📅","Misas e intenciones"],["cat","📖","Catequesis"],["fin","💰","Finanzas","Administración"],["clero","⛪","Clero y personal"],["rep","📈","Reportes"],["conf","⚙","Configuración y roles","Sistema"]];
const T=(h,r,cl)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>`<tr ${cl?'class="cl" onclick="'+cl+'"':''}>${x.map(y=>`<td>${y}</td>`).join("")}</tr>`).join("")}</table>`;
const K=(n,l,d)=>`<div class="card kpi"><div class="l">${l}</div><div class="n">${n}</div><div class="d">${d||""}</div></div>`;
const tg=(t,c="")=>`<span class="tag ${c}">${t}</span>`;
const tabs=(id,a)=>`<div class="tabs">${a.map((x,i)=>`<span class="${i?'':'on'}" onclick="tab(this,'${id}',${i})">${x}</span>`).join("")}</div>`;
function tab(el,id,i){el.parentNode.querySelectorAll("span").forEach((s,j)=>s.classList.toggle("on",j==i));document.querySelectorAll(`[data-t=${id}]`).forEach((p,j)=>p.style.display=j==i?"block":"none")}
const P=(id,i,h)=>`<div data-t="${id}" style="display:${i?'none':'block'}">${h}</div>`;
const meses=["May","Jun","Jul","Ago","Sep","Oct"],ing=[38,42,40,51,47,55],egr=[30,33,35,38,36,40];
function chart(){let s='<svg viewBox="0 0 520 210" width="100%"><g font-size="11" fill="#6b7280">';for(let i=0;i<=4;i++){let y=180-i*40;s+=`<line x1="40" x2="510" y1="${y}" y2="${y}" stroke="#eef"/><text x="5" y="${y+4}">S/${i*15}k</text>`}
meses.forEach((m,i)=>{let x=60+i*77;s+=`<rect x="${x}" y="${180-ing[i]*2.66}" width="26" height="${ing[i]*2.66}" fill="#1d3a6b" rx="3"/><rect x="${x+28}" y="${180-egr[i]*2.66}" width="26" height="${egr[i]*2.66}" fill="#c9a24a" rx="3"/><text x="${x+14}" y="198">${m}</text>`});
return s+'</g></svg><div style="font-size:12px;color:var(--mu)">■ <span style="color:#1d3a6b">Ingresos</span> &nbsp; ■ <span style="color:#c9a24a">Egresos</span> (miles S/)</div>'}

const TIT=["PARTIDA DE BAUTISMO","PARTIDA DE CONFIRMACIÓN","PARTIDA DE MATRIMONIO","PARTIDA DE DEFUNCIÓN"];
const CERTS=[
[{lib:"XII",fol:"45",num:"178",nom:"Sofía Valentina Quispe Rojas",fecha:"14/06/2026",min:"Pbro. L. Torres",g:"a",nac:"02/03/2026",padres:"Juan Quispe Mamani y María Rojas Flores",extra:"Padrinos: Carlos Rojas Flores y Ana Lucía Pérez."},
{lib:"XII",fol:"45",num:"179",nom:"Mateo Huamán Cárdenas",fecha:"14/06/2026",min:"Pbro. L. Torres",g:"o",nac:"19/01/2026",padres:"Pedro Huamán y Carmen Cárdenas",extra:"Padrinos: Luis Mendoza y Elena Benítez."},

{lib:"XII",fol:"46",num:"181",nom:"Thiago Mendoza Paz",fecha:"05/07/2026",min:"Pbro. L. Torres",g:"o",nac:"28/08/2025",padres:"Luis Mendoza y Rosa Paz",extra:"Padrinos: Pedro Huamán y Lucía Herrera."},
{lib:"XII",fol:"47",num:"182",nom:"Valeria Castillo Vega",fecha:"12/07/2026",min:"P. Andrés Soto",g:"a",nac:"12/12/2025",padres:"Mario Castillo y Ana Vega",extra:"Padrinos: Carmen Cruz y Óscar Lima."}],
[{lib:"V",fol:"88",num:"412",nom:"Diego Quispe Rojas",fecha:"15/08/2026",min:"Mons. M. García",extra:"Padrino: Carlos Rojas Flores."},

function cuerpoPartida(t,a){const N=`<b style="font-size:17px">${a.nom.toUpperCase()}</b>`,[ml]=CARGOS[a.min];
if(t==0)return `El suscrito Párroco certifica que en el libro de bautismos de esta parroquia consta que<br>${N}<br>nacid${a.g} el ${fl(a.nac)}, hij${a.g} de ${a.padres},<br>fue bautizad${a.g} el ${fl(a.fecha)} por el ${ml}.<br>${a.extra}`;

const H={

<div class="g g2" style="margin-top:16px"><div class="card"><h3>Parroquias — estado de reportes</h3>${T(["Parroquia","Vicaría","Párroco","Reporte sep."],[["San José","Centro","Pbro. L. Torres",tg("Recibido","ok")],["Ntra. Sra. del Carmen","Norte","Pbro. J. Ramírez",tg("Recibido","ok")],["Santa Rosa de Lima","Sur","Pbro. A. Vargas",tg("Pendiente","w")],["San Martín de Porres","Este","Pbro. R. Díaz",tg("Atrasado","r")],["Cristo Rey","Centro","Pbro. F. Medina",tg("Recibido","ok")]])}</div>
<div class="card"><h3>Avisos recientes</h3>${T(["Fecha","Aviso"],[["12/10","Visita pastoral a Parroquia Cristo Rey — 20/10"],["10/10","Confirmaciones diocesanas en Catedral — 08/11"],["08/10","Vence plazo de reportes del 3er trimestre — 31/10"],["05/10","Retiro del clero — 26 al 28/10"],["01/10","Nuevo arancel diocesano vigente"]])}</div></div>`,

<div class="g g21"><div class="card"><div class="bar"><input placeholder="🔍 Buscar por nombre, DNI o familia…"><select style="width:160px"><option>Todos los sectores</option></select><div class="sp" style="flex:1"></div><button class="btn">+ Nueva ficha</button></div>
${T(["Familia","Jefe de familia","Sector","Miembros","Sacramentos","Estado"],[["Quispe Rojas","Juan Quispe Mamani","Sector 3",5,"Al día",tg("Activa","ok")],["Fernández López","Rosa López Silva","Sector 1",4,"Falta confirm.",tg("Activa","ok")],["Huamán Cárdenas","Pedro Huamán","Sector 2",6,"Al día",tg("Activa","ok")],["Torres Benítez","Elena Benítez","Sector 4",3,"Matrimonio pend.",tg("Seguimiento","w")],["Mendoza Ríos","Luis Mendoza","Sector 1",2,"Al día",tg("Activa","ok")],["Salazar Cruz","Carmen Cruz","Sector 5",4,"Bautizo pend.",tg("Seguimiento","w")],["Paredes Gómez","Jorge Paredes","Sector 2",5,"Al día",tg("Trasladada","r")],["Castillo Vega","Ana Vega","Sector 3",3,"Al día",tg("Activa","ok")]],"")}</div>

<div style="margin-top:12px"><button class="btn sm">Editar</button> <button class="btn out sm">Historial</button></div></div></div>`,
sac:()=>{const tb=["Bautizo","Confirmación","Matrimonio","Defunción"];
return `<h2>Sacramentos</h2><div class="sub">Libros sacramentales · Parroquia San José</div><div class="g g4" style="margin-bottom:16px">${K("XII","Libro de bautismos vigente","Folio 47 de 200")}${K("V","Libro de confirmaciones","Folio 89 de 200")}${K("VIII","Libro de matrimonios","Folio 13 de 150")}${K("IV","Libro de defunciones","Folio 30 de 200")}</div>
<div class="card">${tabs("sa",tb)}${CERTS.map((r,i)=>P("sa",i,`<div class="bar"><input placeholder="🔍 Buscar en libro de ${tb[i].toLowerCase()}…"><div style="flex:1"></div><button class="btn out">+ Registrar ${tb[i].toLowerCase()}</button></div>`+T(["Libro","Folio","Partida",i==2?"Contrayentes":"Nombre","Fecha","Ministro","Acción"],r.map((a,j)=>[a.lib,a.fol,a.num,a.nom,a.fecha,a.min,'<button class="btn gold sm" onclick="emitir('+i+','+j+')">Emitir partida</button>'])))).join("")}</div>`},

let c='<div class="cal"><div class="h"></div>'+d.map(x=>`<div class="h">${x}</div>`).join("");hs.forEach(h=>{c+=`<div><b>${h}</b></div>`;d.forEach((x,i)=>{let e=(ev[h]||[]).includes(i);c+=`<div>${e?`<div class="ev ${h=="17:00"?"b":""}">${h=="17:00"?"Matrimonio":i==6&&h=="12:00"?"Misa solemne":"Misa"}<br><small>${i%2?"P. Soto":"P. Torres"}</small></div>`:""}</div>`})});c+="</div>";

<div class="card"><h3>Intenciones — Dom 18, 09:00</h3>${T(["Intención","Solicita","Estipendio"],[["† Eusebio Paredes (difunto)","Fam. Paredes","S/ 20"],["Salud de Rosa López","Fam. Fernández","S/ 20"],["Acción de gracias aniv. bodas","Luis Mendoza","S/ 20"],["† Teresa Gómez (mes)","Fam. Gómez","S/ 20"],["Por las almas del purgatorio","Anónimo","S/ 10"]])}<button class="btn gold" style="margin-top:12px;width:100%">+ Registrar intención</button></div></div>`},
